# Web 版（web/）をビルドして GitHub Pages に公開する
# 事前に GitHub の Settings → Pages → Build and deployment → Source を「GitHub Actions」にしてください。
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check shared master settings
        # 共有マスタは URL と鍵の両方がそろったときだけ有効。片方だけなら Actions の画面に警告を出す
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "共有マスタ: 有効（$SUPABASE_URL）"
          elif [ -n "$SUPABASE_URL$SUPABASE_ANON_KEY" ]; then
            url_state=未設定; [ -n "$SUPABASE_URL" ] && url_state=設定済み
            key_state=未設定; [ -n "$SUPABASE_ANON_KEY" ] && key_state=設定済み
            echo "::warning title=共有マスタが無効です::リポジトリの Variables に SUPABASE_URL と SUPABASE_ANON_KEY の両方が必要です（現在: SUPABASE_URL=$url_state / SUPABASE_ANON_KEY=$key_state）。"
          else
            echo "共有マスタ: 未設定（機能は表示されません）"
          fi
      - run: npm run build
        env:
          # https://<user>.github.io/<repo>/ で公開するためのパス
          BASE_PATH: /${{ github.event.repository.name }}/
          # 共有マスタ（Supabase）。リポジトリの Settings → Secrets and variables → Actions → Variables に設定すると有効になる
          # （anon key は公開して良い鍵。未設定なら共有マスタの機能は出ない）
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
